syntax = "proto3";

package vibescreen.protocol.v1;

import "vibescreen/protocol/v1/advanced.proto";

option java_multiple_files = true;
option java_package = "dev.vibescreen.protocol.v1";
option swift_prefix = "VS";

enum InputPhase {
  INPUT_PHASE_UNSPECIFIED = 0;
  INPUT_PHASE_BEGAN = 1;
  INPUT_PHASE_CHANGED = 2;
  INPUT_PHASE_ENDED = 3;
  INPUT_PHASE_CANCELLED = 4;
}

enum StylusToolKind {
  STYLUS_TOOL_KIND_UNSPECIFIED = 0;
  STYLUS_TOOL_KIND_PEN = 1;
  STYLUS_TOOL_KIND_ERASER = 2;
}

enum StylusContactState {
  STYLUS_CONTACT_STATE_UNSPECIFIED = 0;
  STYLUS_CONTACT_STATE_CONTACT = 1;
  STYLUS_CONTACT_STATE_PROXIMITY = 2;
}

enum ControllerEventKind {
  CONTROLLER_EVENT_KIND_UNSPECIFIED = 0;
  CONTROLLER_EVENT_KIND_CONNECTED = 1;
  CONTROLLER_EVENT_KIND_STATE = 2;
  CONTROLLER_EVENT_KIND_DISCONNECTED = 3;
}

message NormalizedPoint {
  double x = 1;
  double y = 2;
}

message TouchEvent {
  uint64 input_id = 1;
  uint32 pointer_id = 2;
  InputPhase phase = 3;
  NormalizedPoint position = 4;
  double pressure = 5;
  InputTarget target = 6;
}

// Stylus pressure and tilt components must be finite. Pressure is normalized to
// [0, 1]. Each tilt component is in [-90, 90] degrees, and the two-dimensional
// tilt vector must satisfy hypot(tilt_x_degrees, tilt_y_degrees) <= 90 degrees.
// Phase must be BEGAN, CHANGED, ENDED, or CANCELLED. Position coordinates must
// be finite and normalized to [0, 1]. Extended fields require both peers to
// negotiate CAPABILITY_STYLUS and CAPABILITY_STYLUS_EXTENDED. Without the
// extended capability, fields 9-11 must be omitted and decode as a contacting
// pen with no buttons, preserving the original StylusEvent behavior.
message StylusEvent {
  uint64 input_id = 1;
  uint32 pointer_id = 2;
  InputPhase phase = 3;
  NormalizedPoint position = 4;
  // Normalized force. The value must be finite and in [0, 1] for BEGAN or
  // CHANGED; it must be 0.0 for ENDED or CANCELLED.
  double pressure = 5;
  // Screen-right component of the stylus shaft's deviation from the screen
  // normal, in degrees. The value must be finite and in [-90, 90].
  double tilt_x_degrees = 6;
  // Screen-down component of the stylus shaft's deviation from the screen
  // normal, in degrees. The value must be finite and in [-90, 90].
  double tilt_y_degrees = 7;
  InputTarget target = 8;
  // PEN or ERASER. Extended-capability senders must set this field and must not
  // send UNSPECIFIED or an unknown enum value. Absence means PEN for backward
  // compatibility with legacy StylusEvent messages.
  optional StylusToolKind tool_kind = 9;
  // Bit 0 is the primary barrel button and bit 1 is the secondary barrel
  // button. All other bits are reserved and must be zero.
  uint32 button_mask = 10;
  // CONTACT or PROXIMITY. Extended-capability senders must set this field and
  // must not send UNSPECIFIED or an unknown enum value. Absence means CONTACT
  // for backward compatibility. PROXIMITY samples must have pressure 0.0;
  // their phase describes hover enter/change/exit.
  optional StylusContactState contact_state = 11;
}

// Controller input requires CAPABILITY_CONTROLLER. input_id must be non-zero
// and strictly increase within the ControllerEvent subsequence of the current
// negotiated session. controller_id must encode to 1-128 UTF-8 bytes, be stable
// and sender-scoped within that session, and must not contain a raw serial
// number or other sensitive identifier. controller_epoch must be non-zero and
// strictly increase for the same controller_id within the negotiated session.
// CONNECTED starts a lifecycle for (controller_id, controller_epoch), STATE is
// valid only inside that lifecycle, and DISCONNECTED ends it. Reusing or
// decreasing an epoch for the same controller_id is invalid.
// Duplicate CONNECTED, STATE before CONNECTED, and STATE after DISCONNECTED
// are invalid. At most four controller lifecycles may be active concurrently
// in one negotiated session. For each CONNECTED that reaches a non-terminal
// admission result, a receiver must send exactly one InputAck. It must send
// accepted=true only after the production/native controller handler accepts
// the lifecycle. A CONNECTED that would exceed the active-controller limit
// instead receives accepted=false with rejection_reason
// "maximum_active_controllers_exceeded", without closing the session or
// changing any admitted controller lifecycle. A native-handler failure is a
// hard protocol error: the receiver sends ProtocolError and closes the session
// without sending an accepted InputAck. STATE and DISCONNECTED do not receive
// InputAck. A sender must not send either for a lifecycle until its CONNECTED
// receives accepted=true. Every controller InputAck must copy input_id, and its
// Envelope must correlate to the triggering ControllerEvent message_id while
// carrying the active session_id and session_epoch.
// A new negotiated session resets both monotonic sequences.
// Kind must be CONNECTED, STATE, or DISCONNECTED; UNSPECIFIED and unknown enum
// values are invalid. Button bits 0-12 are defined and all higher bits are
// reserved and must be zero. Stick axes must be finite and in [-1, 1], trigger
// values must be finite and in [0, 1], and hat axes must each be -1, 0, or 1.
// CONNECTED and DISCONNECTED are neutral lifecycle markers: button_mask and all
// axes, triggers, and hat values must be zero. A receiver must synthesize this
// same neutral state before discarding an active controller on disconnect,
// session teardown, ownership takeover, or transport loss.
message ControllerEvent {
  uint64 input_id = 1;
  string controller_id = 2;
  uint64 controller_epoch = 3;
  ControllerEventKind kind = 4;
  // Bits 0-12 are south, east, west, north, L1, R1, L2 digital, R2 digital,
  // select, start, guide/mode, L3, and R3, respectively. Bits 13-31 are
  // reserved and must be zero.
  uint32 button_mask = 5;
  double left_stick_x = 6;
  double left_stick_y = 7;
  double right_stick_x = 8;
  double right_stick_y = 9;
  double left_trigger = 10;
  double right_trigger = 11;
  sint32 hat_x = 12;
  sint32 hat_y = 13;
  InputTarget target = 14;
}

message PointerEvent {
  uint64 input_id = 1;
  InputPhase phase = 2;
  NormalizedPoint position = 3;
  uint32 button_mask = 4;
  InputTarget target = 5;
}

message ScrollEvent {
  uint64 input_id = 1;
  double delta_x = 2;
  double delta_y = 3;
  InputTarget target = 4;
}

message KeyEvent {
  uint64 input_id = 1;
  uint32 usb_hid_usage = 2;
  bool pressed = 3;
  // When CAPABILITY_USB_HID_MODIFIER_BYTE is negotiated, this is the standard
  // USB HID modifier byte: bit 0 Left Control, bit 1 Left Shift, bit 2 Left
  // Alt/Option, bit 3 Left GUI/Command, bit 4 Right Control, bit 5 Right Shift,
  // bit 6 Right Alt/Option, and bit 7 Right GUI/Command. Without that
  // capability, the legacy Protocol v1 layout remains bit 0 Shift, bit 1
  // Control, bit 2 Alt/Option, and bit 3 GUI/Command; bits 4-7 are undefined
  // and must be zero. Bits 8-31 are reserved and must be zero in either layout.
  uint32 modifier_mask = 4;
  string text = 5;
  InputTarget target = 6;
}

// When acknowledging ControllerEvent, correlation and session metadata follow
// the ControllerEvent rules above. No controller identity is repeated here; a
// sender correlates input_id to its bounded set of pending CONNECTED lifecycles.
message InputAck {
  uint64 input_id = 1;
  bool accepted = 2;
  string rejection_reason = 3;
}

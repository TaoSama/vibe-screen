syntax = "proto3";

package vibescreen.protocol.v1;

import "vibescreen/protocol/v1/advanced.proto";
import "vibescreen/protocol/v1/common.proto";

option java_multiple_files = true;
option java_package = "dev.vibescreen.protocol.v1";
option swift_prefix = "VS";

message VideoConfig {
  uint64 config_epoch = 1;
  Codec codec = 2;
  Dimensions encoded_size = 3;
  uint32 frames_per_second = 4;
  uint32 bitrate_kbps = 5;
  uint64 stream_id = 6;
  ColorDescription color_description = 7;
  uint32 rotation_degrees = 8;
}

message VideoConfigResult {
  uint64 config_epoch = 1;
  bool accepted = 2;
  string rejection_reason = 3;
  uint64 stream_id = 4;
  ColorDescription selected_color_description = 5;
}

// Coarse client-selectable quality intent. The host maps a preset to its
// internal encoder quality when the client does not request an explicit
// bitrate, so clients can express intent without knowing host encoder units.
enum VideoQualityPreset {
  VIDEO_QUALITY_PRESET_UNSPECIFIED = 0;
  VIDEO_QUALITY_PRESET_SMOOTH = 1;
  VIDEO_QUALITY_PRESET_BALANCED = 2;
  VIDEO_QUALITY_PRESET_SHARP = 3;
}

// Client-driven video tuning request sent to the host on the active session.
// Every field is optional so a client can adjust one dimension at a time; an
// unset field leaves the corresponding host setting unchanged. The host
// clamps values to the negotiated capabilities and its supported range, then
// re-advertises the applied VideoConfig with a bumped config_epoch. Requires
// the CAPABILITY_CLIENT_VIDEO_CONTROL capability to be negotiated.
message SetVideoPreferences {
  // Requested encoder bitrate in kbps. 0 leaves the current bitrate unchanged.
  uint32 bitrate_kbps = 1;
  // Requested capture/encode frame rate. 0 leaves the current rate unchanged.
  uint32 frames_per_second = 2;
  // Coarse quality intent applied when no explicit bitrate is requested.
  VideoQualityPreset quality_preset = 3;
}

message RequestKeyframe {
  uint64 stream_id = 1;
  string reason_code = 2;
}

message VideoStreamEnded {
  uint64 stream_id = 1;
  string reason_code = 2;
}

message MediaPacketHeader {
  uint64 stream_id = 1;
  uint64 session_epoch = 2;
  uint64 config_epoch = 3;
  uint64 frame_id = 4;
  uint32 fragment_index = 5;
  uint32 fragment_count = 6;
  uint64 capture_timestamp_ns = 7;
  bool keyframe = 8;
  Codec codec = 9;
  uint32 payload_length = 10;
}

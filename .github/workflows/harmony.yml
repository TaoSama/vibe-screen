name: HarmonyOS portable checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable-core:
    name: Portable core (no DevEco or HAP claim)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/harmony/pnpm-lock.yaml
      - name: Install pinned portable test dependencies
        run: pnpm --dir apps/harmony install --frozen-lockfile
      - name: Run canonical portable verification
        run: pnpm --dir apps/harmony verify
      - name: Validate HarmonyOS readiness and device-gate tooling contracts
        run: |
          set +e
          python3 scripts/harmony_readiness.py --output /tmp/harmony-readiness.json
          status=$?
          set -e
          test "$status" = "2"
          python3 - <<'PY'
          import json
          with open("/tmp/harmony-readiness.json", encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["schema_version"] == "vibescreen.evidence/v1"
          assert report["kind"] == "harmony_readiness_preflight"
          assert report["verdict"] == "blocked"
          assert report["blocking_reasons"]
          PY
          python3 scripts/harmony_device_gate.py --template > /tmp/harmony-device-gates.json
          python3 scripts/harmony_device_gate.py --allow-blocked /tmp/harmony-device-gates.json
          mkdir -p /tmp/harmony-matepad-acceptance
          cp /tmp/harmony-readiness.json /tmp/harmony-matepad-acceptance/harmony-readiness.json
          set +e
          python3 scripts/harmony_matepad_acceptance.py --evidence-dir /tmp/harmony-matepad-acceptance --write-blocked
          status=$?
          set -e
          test "$status" = "2"
          python3 - <<'PY'
          import json
          with open("/tmp/harmony-matepad-acceptance/harmony-matepad-acceptance.json", encoding="utf-8") as handle:
              package = json.load(handle)
          assert package["schema_version"] == "vibescreen.evidence/v1"
          assert package["kind"] == "harmony_matepad_mini_acceptance_package"
          assert package["verdict"] == "blocked"
          assert package["device_gate_manifest"]["allow_blocked_valid"] is True
          assert package["device_gate_manifest"]["strict_valid"] is False
          PY
          mkdir -p /tmp/harmony-matepad-acceptance
          cp /tmp/harmony-readiness.json /tmp/harmony-matepad-acceptance/harmony-readiness.json
          set +e
          python3 scripts/harmony_matepad_acceptance.py \
            --evidence-dir /tmp/harmony-matepad-acceptance \
            --write-blocked
          matepad_status=$?
          set -e
          test "$matepad_status" = "2"
          python3 - <<'PY'
          import json
          with open("/tmp/harmony-matepad-acceptance/harmony-matepad-acceptance.json", encoding="utf-8") as handle:
              package = json.load(handle)
          assert package["schema_version"] == "vibescreen.evidence/v1"
          assert package["kind"] == "harmony_matepad_mini_acceptance_package"
          assert package["verdict"] == "blocked"
          assert package["device_gate_manifest"]["allow_blocked_valid"] is True
          assert package["device_gate_manifest"]["strict_valid"] is False
          assert package["current_base_gate"]["verdict"] == "blocked"
          PY

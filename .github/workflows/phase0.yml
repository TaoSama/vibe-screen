name: Phase 0 checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.12
          cache: false
      - run: make protocol

  evidence-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: make evidence-tools-test
      - run: make release-tools-test

  phase3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Bind verification to the workflow commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Phase 3 verification commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Run Phase 3, privacy, evidence, and link gates
        run: make phase3-test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: make baseline-android-check

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: make baseline-macos-build
      - run: make baseline-macos-self-test
      - run: make baseline-macos-test
      - run: make baseline-macos-app
      - uses: actions/upload-artifact@v7
        with:
          name: telemachus-macos-ad-hoc-signed
          path: .build/release-artifacts/*
          if-no-files-found: error

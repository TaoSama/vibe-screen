name: Phase 0 checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
      - run: make protocol

  evidence-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make evidence-tools-test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: make baseline-android-check

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: make baseline-macos-build
      - run: make baseline-macos-self-test
      - run: make baseline-macos-test
      - run: make baseline-macos-app
      - uses: actions/upload-artifact@v4
        with:
          name: telemachus-macos-unsigned
          path: .build/release-artifacts/*
          if-no-files-found: error

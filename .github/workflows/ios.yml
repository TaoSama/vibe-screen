name: iOS engineering gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Verify generated Protocol v1 bindings are current
        run: apps/ios/Scripts/verify-generated-protocol.sh
      - name: Resolve pinned dependencies
        run: swift package --package-path apps/ios resolve
      - name: Build native protocol, session, transport, and video modules
        run: swift build --package-path apps/ios --configuration release
      - name: Run deterministic self-test and shared Protocol v1 compatibility fixture
        run: apps/ios/.build/release/vibescreen-ios-selftest
      - name: Run trusted-LAN iOS Core to production MacHost loopback
        run: apps/ios/Scripts/run_machost_loopback.py
      - name: Run baseline MacHost self-tests
        run: make baseline-macos-self-test

  app-build-test-archive:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build and test on an iPhone simulator, then create an unsigned archive
        run: apps/ios/Scripts/build_ios.py
      - name: Upload unsigned archive
        uses: actions/upload-artifact@v7
        with:
          name: VibeScreen-unsigned-xcarchive
          path: apps/ios/.build/xcode/VibeScreen.xcarchive
          if-no-files-found: error

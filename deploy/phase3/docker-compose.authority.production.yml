name: vibe-screen-authority-production

x-authority-container: &authority-container
  image: ${VIBE_AUTHORITY_IMAGE_REPOSITORY:?set the vibe-authority image repository}@sha256:${VIBE_AUTHORITY_IMAGE_SHA256:?set the 64-character vibe-authority image digest}
  user: "65532:65532"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 128
  mem_limit: 256m
  cpus: 1.0
  stop_grace_period: 30s
  tmpfs:
    - /tmp:size=16m,mode=0700,uid=65532,gid=65532
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  authority-secrets-init:
    image: coturn/coturn:4.7.0-r0@sha256:99bf5bf6ab1c119862d0c3d2dfb2bbf805a86a131492cab18c148be64ae7d978
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        copy_secret() {
          source_name=$$1
          target_dir=$$2
          target_name=$$3
          mkdir -p "$$target_dir"
          chmod 0755 "$$target_dir"
          temporary="$$target_dir/.$$target_name.tmp"
          cp "/run/secrets/$$source_name" "$$temporary"
          chmod 0400 "$$temporary"
          chown 65532:65532 "$$temporary"
          mv "$$temporary" "$$target_dir/$$target_name"
        }
        copy_secret migration_database_url /out/migrate migration_database_url
        copy_secret database_url /out/authority database_url
        copy_secret admin_token /out/authority admin_token
        copy_secret signaling_token /out/authority signaling_token
        copy_secret relay_token /out/authority relay_token
        copy_secret coturn_token /out/authority coturn_token
        copy_secret role_token_secret /out/authority role_token_secret
    network_mode: none
    secrets:
      - migration_database_url
      - database_url
      - admin_token
      - signaling_token
      - relay_token
      - coturn_token
      - role_token_secret
    volumes:
      - authority-migrate-runtime-secrets:/out/migrate
      - authority-runtime-secrets:/out/authority
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.5
    restart: "no"

  authority-migrate:
    <<: *authority-container
    restart: "no"
    depends_on:
      authority-secrets-init:
        condition: service_completed_successfully
    command:
      - --migrate
      - /usr/share/vibe-screen/migrations
    environment:
      VIBE_AUTHORITY_DATABASE_URL_FILE: /run/secrets/migration_database_url
      VIBE_AUTHORITY_DATABASE_TLS_MODE: verify-full
    volumes:
      - authority-migrate-runtime-secrets:/run/secrets:ro

  authority:
    <<: *authority-container
    restart: unless-stopped
    depends_on:
      authority-secrets-init:
        condition: service_completed_successfully
      authority-migrate:
        condition: service_completed_successfully
    environment:
      VIBE_AUTHORITY_DATABASE_URL_FILE: /run/secrets/database_url
      VIBE_AUTHORITY_DATABASE_TLS_MODE: verify-full
      VIBE_AUTHORITY_ADMIN_TOKEN_FILE: /run/secrets/admin_token
      VIBE_AUTHORITY_SIGNALING_TOKEN_FILE: /run/secrets/signaling_token
      VIBE_AUTHORITY_RELAY_TOKEN_FILE: /run/secrets/relay_token
      VIBE_AUTHORITY_COTURN_TOKEN_FILE: /run/secrets/coturn_token
      VIBE_AUTHORITY_ROLE_TOKEN_SECRET_FILE: /run/secrets/role_token_secret
    volumes:
      - ${VIBE_AUTHORITY_CONFIG_FILE:-./config/authority.production.json}:/etc/vibe-screen/authority.json:ro
      - authority-runtime-secrets:/run/secrets:ro
    ports:
      - "127.0.0.1:8091:8091/tcp"
    healthcheck:
      test: ["CMD", "/vibe-authority", "--healthcheck", "http://127.0.0.1:8091/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

secrets:
  migration_database_url:
    file: ${VIBE_AUTHORITY_MIGRATION_DATABASE_URL_FILE:?set the migration database URL secret file}
  database_url:
    file: ${VIBE_AUTHORITY_DATABASE_URL_FILE:?set the runtime database URL secret file}
  admin_token:
    file: ${VIBE_AUTHORITY_ADMIN_TOKEN_FILE:?set the admin token secret file}
  signaling_token:
    file: ${VIBE_AUTHORITY_SIGNALING_TOKEN_FILE:?set the signaling token secret file}
  relay_token:
    file: ${VIBE_AUTHORITY_RELAY_TOKEN_FILE:?set the relay token secret file}
  coturn_token:
    file: ${VIBE_AUTHORITY_COTURN_TOKEN_FILE:?set the coturn token secret file}
  role_token_secret:
    file: ${VIBE_AUTHORITY_ROLE_TOKEN_SECRET_FILE:?set the role-token secret file}

volumes:
  authority-migrate-runtime-secrets:
  authority-runtime-secrets:

name: vibe-screen-phase3-local

services:
  relay-data-init:
    image: coturn/coturn:4.7.0-r0@sha256:99bf5bf6ab1c119862d0c3d2dfb2bbf805a86a131492cab18c148be64ae7d978
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 65532:65532 /data && chmod 0750 /data"]
    network_mode: none
    volumes:
      - relay-data:/data
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    restart: "no"

  relay-secrets-init:
    image: coturn/coturn:4.7.0-r0@sha256:99bf5bf6ab1c119862d0c3d2dfb2bbf805a86a131492cab18c148be64ae7d978
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        copy_secret() {
          source_name=$$1
          target_dir=$$2
          target_name=$$3
          mode=$$4
          mkdir -p "$$target_dir"
          chmod 0755 "$$target_dir"
          temporary="$$target_dir/.$$target_name.tmp"
          cp "/run/secrets/$$source_name" "$$temporary"
          chmod "$$mode" "$$temporary"
          chown 65532:65532 "$$temporary"
          mv "$$temporary" "$$target_dir/$$target_name"
        }
        copy_secret turn_secret /out/relay turn_secret 0400
        copy_secret client_token /out/relay client_token 0400
        copy_secret usage_token /out/relay usage_token 0400
        copy_secret metrics_token /out/relay metrics_token 0400
        copy_secret admin_token /out/relay admin_token 0400
        copy_secret authority_token /out/relay authority_token 0400
        copy_secret turn_secret /out/coturn turn_secret 0400
    network_mode: none
    secrets:
      - turn_secret
      - client_token
      - usage_token
      - metrics_token
      - admin_token
      - authority_token
    volumes:
      - relay-runtime-secrets:/out/relay
      - coturn-runtime-secrets:/out/coturn
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.5
    restart: "no"

  relay:
    build:
      context: ../../services/relay
      dockerfile: Dockerfile
      args:
        VERSION: 0.1.0
    restart: unless-stopped
    depends_on:
      relay-data-init:
        condition: service_completed_successfully
      relay-secrets-init:
        condition: service_completed_successfully
    environment:
      VIBE_RELAY_TURN_SECRET_FILE: /run/secrets/turn_secret
      VIBE_RELAY_CLIENT_TOKEN_FILE: /run/secrets/client_token
      VIBE_RELAY_USAGE_TOKEN_FILE: /run/secrets/usage_token
      VIBE_RELAY_METRICS_TOKEN_FILE: /run/secrets/metrics_token
      VIBE_RELAY_ADMIN_TOKEN_FILE: /run/secrets/admin_token
      VIBE_RELAY_AUTHORITY_TOKEN_FILE: /run/secrets/authority_token
    volumes:
      - ./config/relay.local.json:/etc/vibe-relay/config.json:ro
      - relay-data:/data
      - relay-runtime-secrets:/run/secrets:ro
    ports:
      - "127.0.0.1:8090:8090/tcp"
    healthcheck:
      test: ["CMD", "/vibe-relay", "--healthcheck", "http://127.0.0.1:8090/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  coturn:
    image: coturn/coturn:4.7.0-r0@sha256:99bf5bf6ab1c119862d0c3d2dfb2bbf805a86a131492cab18c148be64ae7d978
    restart: unless-stopped
    user: "65532:65532"
    entrypoint: ["/bin/sh", "/opt/vibe/start-coturn.sh"]
    depends_on:
      relay-secrets-init:
        condition: service_completed_successfully
    environment:
      COTURN_CONFIG_FILE: /etc/vibe-coturn/local.conf
    volumes:
      - ./coturn:/etc/vibe-coturn:ro
      - ./scripts/start-coturn.sh:/opt/vibe/start-coturn.sh:ro
      - coturn-runtime-secrets:/run/secrets:ro
    ports:
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:3478:3478/tcp"
      - "127.0.0.1:49160-49200:49160-49200/udp"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=0700,uid=65532,gid=65532
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "-p", "3478", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

secrets:
  turn_secret:
    file: ./secrets/turn_secret.txt
  client_token:
    file: ./secrets/client_token.txt
  usage_token:
    file: ./secrets/usage_token.txt
  metrics_token:
    file: ./secrets/metrics_token.txt
  admin_token:
    file: ./secrets/admin_token.txt
  authority_token:
    file: ./secrets/authority_token.txt

volumes:
  relay-data:
  relay-runtime-secrets:
  coturn-runtime-secrets:

name: vibe-screen-phase3-production

services:
  relay-migrate:
    image: ${VIBE_RELAY_IMAGE_REPOSITORY:?set the vibe-relay image repository}@sha256:${VIBE_RELAY_IMAGE_SHA256:?set the 64-character vibe-relay image digest}
    restart: "no"
    network_mode: host
    command:
      - --migrate
      - /usr/share/vibe-screen/migrations/001_relay.sql
    environment:
      VIBE_RELAY_DATABASE_URL_FILE: /run/secrets/relay_migration_database_url
      VIBE_RELAY_DATABASE_TLS_MODE: verify-full
    secrets:
      - relay_migration_database_url
    security_opt:
      - no-new-privileges:true

  relay:
    image: ${VIBE_RELAY_IMAGE_REPOSITORY:?set the vibe-relay image repository}@sha256:${VIBE_RELAY_IMAGE_SHA256:?set the 64-character vibe-relay image digest}
    restart: unless-stopped
    network_mode: host
    depends_on:
      relay-migrate:
        condition: service_completed_successfully
    environment:
      VIBE_RELAY_DATABASE_URL_FILE: /run/secrets/relay_database_url
      VIBE_RELAY_DATABASE_TLS_MODE: verify-full
      VIBE_RELAY_TURN_SECRET_FILE: /run/secrets/turn_secret
      VIBE_RELAY_CLIENT_TOKEN_FILE: /run/secrets/client_token
      VIBE_RELAY_USAGE_TOKEN_FILE: /run/secrets/usage_token
      VIBE_RELAY_METRICS_TOKEN_FILE: /run/secrets/metrics_token
      VIBE_RELAY_ADMIN_TOKEN_FILE: /run/secrets/admin_token
      VIBE_RELAY_AUTHORITY_TOKEN_FILE: /run/secrets/authority_token
    secrets:
      - turn_secret
      - client_token
      - usage_token
      - metrics_token
      - admin_token
      - authority_token
      - relay_database_url
    volumes:
      - ./config/relay.production.json:/etc/vibe-relay/config.json:ro
    healthcheck:
      test: ["CMD", "/vibe-relay", "--healthcheck", "http://127.0.0.1:8090/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

  coturn:
    image: coturn/coturn:4.7.0-r0@sha256:99bf5bf6ab1c119862d0c3d2dfb2bbf805a86a131492cab18c148be64ae7d978
    restart: unless-stopped
    network_mode: host
    user: "65532:65532"
    entrypoint: ["/bin/sh", "/opt/vibe/start-coturn.sh"]
    environment:
      COTURN_CONFIG_FILE: /etc/vibe-coturn/production.conf
      COTURN_EXTERNAL_IP: ${COTURN_EXTERNAL_IP:?set public/private IP mapping}
      COTURN_REALM: ${COTURN_REALM:?set the public relay hostname}
    secrets:
      - turn_secret
      - coturn_cli_password
      - tls_certificate
      - tls_private_key
    volumes:
      - ./coturn:/etc/vibe-coturn:ro
      - ./scripts/start-coturn.sh:/opt/vibe/start-coturn.sh:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=0700,uid=65532,gid=65532
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "-p", "3478", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

secrets:
  turn_secret:
    file: ./secrets/turn_secret.txt
  coturn_cli_password:
    file: ./secrets/coturn_cli_password.txt
  client_token:
    file: ./secrets/client_token.txt
  usage_token:
    file: ./secrets/usage_token.txt
  metrics_token:
    file: ./secrets/metrics_token.txt
  admin_token:
    file: ./secrets/admin_token.txt
  authority_token:
    file: ./secrets/authority_token.txt
  relay_migration_database_url:
    file: ${VIBE_RELAY_MIGRATION_DATABASE_URL_FILE:?set the relay migration database URL secret file}
  relay_database_url:
    file: ${VIBE_RELAY_DATABASE_URL_FILE:?set the relay runtime database URL secret file}
  tls_certificate:
    file: ./tls/fullchain.pem
  tls_private_key:
    file: ./tls/privkey.pem
